# voron24_250.ini — PrusaSlicer 프로파일 (Voron 2.4 R2 250mm)
# docs/04b_gcode_pipeline.md §294 / docs/04_single_entrypoint.md §578
#
#   prusa-slicer --export-gcode --load tools/slicer/voron24_250.ini \
#                --center 125,125 -o out.gcode model.stl
#
# PrusaSlicer 공식 번들에 Voron 프로파일이 없어 직접 만든 것이다. **시뮬레이션 전용**
# 이므로 압출·온도·재료 값은 의미가 없고 궤적만 맞으면 된다. 그래도 슬라이서가 물리적
# 으로 말이 되는 값을 요구하므로 ABS 기준의 그럴듯한 값을 채워 뒀다.
#
# 여기 없는 키는 PrusaSlicer 내장 기본값이 그대로 쓰인다. 아래 있는 것만이 "못박은"
# 값이며 그 이유는 각 절 머리에 적어 뒀다.
#
# 파서를 단순하게 유지하기 위한 4 대 제약 (04b §302 표):
#   arc fitting 끔 / G90 절대좌표 / start·end G-code 비움 / 베드 250x250 origin 코너
#
# 설치된 PrusaSlicer 가 어떤 키를 모른다고 경고하면 그 줄은 지워도 된다 — 전부 출력물을
# 깔끔하게 만들기 위한 것이지 궤적을 바꾸는 값이 아니다.

# ---------------------------------------------------------------------------
# 프린터 — 베드는 계약의 bed_origin 과 부호가 맞아야 한다.
#
# 계약상 bed_origin 은 base_link 에 fixed 이고 (-0.125, -0.125, 0.064), 조인트 값은
# G-code 좌표 / 1000 이며 모든 prismatic 의 lower 는 0 이다. 따라서 G-code 의
# X/Y 는 0..250 mm 여야 하고 베드 원점은 코너다. 부호는 pattern:=sweep 로 먼저 볼 것.
#
# 250x250x250 은 voron24_params.xacro 의 stroke_x/y/z = 0.250 및
# bed_plate_x/y = 0.250 과 같은 값이다. 저쪽을 고치면 여기도 고쳐야 한다.
# ---------------------------------------------------------------------------
printer_technology = FFF
printer_model = Voron24-250
bed_shape = 0x0,250x0,250x250,0x250
max_print_height = 250
nozzle_diameter = 0.4
z_offset = 0

# Voron 은 Klipper 를 돈다. 설치된 PrusaSlicer 가 이 값을 모르면 marlin2 로 낮출 것
# (2.6 미만). 파서는 G0/G1/G28/G90/G92/M82/M83 만 보므로 방언 차이는 영향이 없다.
gcode_flavor = klipper
use_relative_e_distances = 0
use_firmware_retraction = 0
use_volumetric_e = 0
single_extruder_multi_material = 0
binary_gcode = 0

# G2/G3 원호가 나오면 파서가 경고 후 무시한다. 애초에 안 나오게 끈다 (04b §306).
arc_fitting = disabled

# M201/M203 을 안 뱉게. 파서가 M 을 무시하므로 궤적에는 영향이 없고 출력만 깔끔해진다.
machine_limits_usage = ignore

# ---------------------------------------------------------------------------
# 커스텀 G-code — 전부 비움 (04b §308).
# 홈잉·프라임·QGL 매크로가 궤적을 오염시킨다. 특히 Voron 의 start_gcode 는
# QUAD_GANTRY_LEVEL 같은 Klipper 매크로라 파서가 볼 것이 없으면서 시간만 먹는다.
# ---------------------------------------------------------------------------
start_gcode =
end_gcode =
before_layer_gcode =
layer_gcode =
toolchange_gcode =
between_objects_gcode =
color_change_gcode =
pause_print_gcode =
template_custom_gcode =
start_filament_gcode = ""
end_filament_gcode = ""

# 온도 M104/M109 자동 삽입도 끈다. 시뮬레이션에 온도는 없다.
autoemit_temperature_commands = 0

# 썸네일을 켜면 base64 PNG 가 주석 수천 줄로 들어가 파서가 헛일을 한다.
thumbnails =

# Klipper 의 EXCLUDE_OBJECT_DEFINE 주석 블록도 같은 이유로 끈다.
gcode_label_objects = disabled

# 무브마다 붙는 설명 주석. 0 이어도 G-code 뷰어용 태그(;LAYER_CHANGE, ;HEIGHT:,
# ;WIDTH:, ;TYPE:)는 그대로 나온다. 설치된 버전에서 ;WIDTH: 가 안 보이면 1 로 올릴 것 —
# gcode_player_node 는 없으면 E 로 역산하는 폴백이 있어 없어도 돌기는 한다.
gcode_comments = 0

# ---------------------------------------------------------------------------
# 레이어·둘레 — layer_height 0.2 는 gcode_player_node.DEFAULT_LAYER_HEIGHT_MM 과
# 같은 값이다. `;WIDTH:` 없이 E 로 width 를 역산할 때 분모로 쓰이므로 어긋나면
# Unity 의 선 굵기가 틀어진다.
# ---------------------------------------------------------------------------
layer_height = 0.2
first_layer_height = 0.25
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
extrusion_width = 0.45
first_layer_extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4

# 데모 시간을 줄이려고 서포트·브림은 끄고 스커트만 한 줄 남긴다. 스커트는 베드 밖으로
# 나가 좌표가 음수가 되기도 하는데 클램프는 상태 노드(A) 몫이라 여기서 신경 쓰지 않는다.
support_material = 0
brim_width = 0
skirts = 1
skirt_distance = 3
skirt_height = 1
complete_objects = 0
spiral_vase = 0
avoid_crossing_perimeters = 0

# ---------------------------------------------------------------------------
# 속도 — F 는 재생 속도로 그대로 쓰이고 motion.py 가 축별 최대속도로 클램프한다.
# voron24_params.xacro 의 vel_xy = 0.5 m/s (500 mm/s), vel_z = 0.05 m/s (50 mm/s)
# 안쪽에 머무르도록 잡았다. 넘기면 조용히 느리게 재생될 뿐이라 눈에 안 띈다.
# ---------------------------------------------------------------------------
travel_speed = 300
travel_speed_z = 20
perimeter_speed = 60
external_perimeter_speed = 40
small_perimeter_speed = 25
infill_speed = 120
solid_infill_speed = 90
top_solid_infill_speed = 50
gap_fill_speed = 40
bridge_speed = 40
support_material_speed = 60
first_layer_speed = 20
max_print_speed = 200
max_volumetric_speed = 0

# ---------------------------------------------------------------------------
# 필라멘트 — 1.75 mm 는 gcode_player_node.FILAMENT_RADIUS_MM (1.75/2) 과 같은 값.
# width 역산식의 상수라 여기를 바꾸면 저쪽도 바꿔야 한다.
# 온도·재료는 시뮬레이션에 무의미하지만 슬라이서가 값을 요구한다.
# ---------------------------------------------------------------------------
filament_diameter = 1.75
filament_type = ABS
filament_density = 1.04
extrusion_multiplier = 1
temperature = 245
first_layer_temperature = 245
bed_temperature = 100
first_layer_bed_temperature = 100

# ---------------------------------------------------------------------------
# 리트랙션 — E 가 줄어드는 구간이 곧 extruding=false 구간이다. 0 으로 두면 Unity 의
# 압출 선이 이동 구간에서도 안 끊긴다.
# ---------------------------------------------------------------------------
retract_length = 0.8
retract_speed = 35
deretract_speed = 35
retract_before_travel = 2
retract_layer_change = 0
retract_lift = 0.2
wipe = 0
